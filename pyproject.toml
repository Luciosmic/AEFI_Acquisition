[project]
name = "aefi-acquisition"
version = "0.1.0"
description = "AEFI Acquisition System"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.0.0",
    "PySide6-QtAds>=4.4.0",
    "numpy~=2.2",
    "matplotlib>=3.5.0",
    "pylablib>=1.4.2",
    "arcus-performax-4ex",
    "lidar-vl53l0x-esp32",
    "h5py>=3.8.0",
    "pyvista>=0.42.3",
    "scipy~=1.14",
    "moderngl>=5.8.0",
    "glfw>=2.5.0",
    "numba>=0.57.0",
    "pandas>=1.5.0",
    "pyvistaqt>=0.13.1",
    "mcp<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[tool.uv]
# Configuration for uv package manager
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]

[tool.uv.sources]
# Pilotes publiés (un repo par instrument, Desktop\THESE-LUIS-EXPERIMENTAL\Hardware - Drivers) :
# source unique partagée avec les scripts de caractérisation. Une correction se fait dans le
# repo du pilote ; AEFI monte ici son tag.
arcus-performax-4ex = { git = "https://github.com/Luciosmic/driver-arcus-performax-4ex.git", tag = "v0.1.0" }
lidar-vl53l0x-esp32 = { git = "https://github.com/Luciosmic/driver-lidar-vl53l0x-esp32.git", tag = "v0.1.0" }

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = ["AEFI_Acquisition"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
# Garde du typage, posée par solidai-developpement/scripts/installer-garde-repo-dev.sh (oracle-garde-mypy.md).
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true
follow_imports = "silent"
