# Profil de l'humain dans un dossier de travail de la thèse, lancé par le wrapper VSCode
# (claude-wrappers/au-vscode/launch.sh). Un seul inject propre, le contexte du repo ; tous les autres
# sont partagés par lien qualifié, sans copie, depuis GRAPHE-THESE et les packages
# (modèle : PUBLICATIONS/IEEE-SENSORS-JOURNAL).
type: agent-profile::au-mcp-sdk
inject:
  # Arscontexta
  # sh-agent-os d'abord : le socle, puis le domaine (creer-un-workspace)
  - "[[core-profile::sh-agent-os]]"
  - "[[co-inhabitant::GRAPHE-THESE]]"
  - "[[core-profile::au-writing-style]]"
  - "[[core-profile::au-rules]]"
  - "[[capture-correction::au-govern]]"
  # Contributions de l'humain
  - "[[orient-work::sh-agent-os]]"
  # Ce repo : lancement, données, branches et worktrees (remplace l'ancien CLAUDE.md, 2026-11-16)
  - "[[contexte-du-repo-aefi-acquisition]]"
# Refuse la première mutation d'une session non inscrite au registre des travaux (chemin relatif à
# la racine du workspace servi).
hookConfig:
  - type: mcp.hook.registre-obligatoire::sh-agent-os
    registre: _system/ops/registre-des-travaux.md
