# Vibe Hooks Configuration for AEFI Acquisition Project
# This replaces the Claude hooks functionality with Vibe's experimental hooks

# Session start hook - clear session tracking files
[[hooks]]
name = "session-start-cleanup"
type = "post_agent_turn"
command = "bash .vibe/hooks/session-start.sh"
timeout = 30.0
description = "Clear session tracking files at session start"

# Track touched files on write/edit operations
[[hooks]]
name = "track-touched-files"
type = "after_tool"
match = "write_file"
command = "bash .vibe/hooks/track-touched-files.sh"
timeout = 10.0
description = "Track files modified by write_file tool"

[[hooks]]
name = "track-edited-files"
type = "after_tool"
match = "edit"
command = "bash .vibe/hooks/track-touched-files.sh"
timeout = 10.0
description = "Track files modified by edit tool"

# Inject session ID for tracking
[[hooks]]
name = "inject-session-id"
type = "before_tool"
match = "*"
command = "bash .vibe/hooks/inject-session-id.sh"
timeout = 5.0
description = "Inject session ID into tool calls for tracking"
